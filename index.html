<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Fixed VR Background Passthrough</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
      #ui {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
      }
      button {
        padding: 15px 30px;
        background: #111;
        color: #0f0;
        border: 2px solid #0f0;
        border-radius: 8px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>

    <div id="ui">
      <button onclick="toggleLens()">SWITCH REAR LENS (Main / Ultra-Wide)</button>
    </div>

    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .interactive">
      <a-assets>
        <video id="webcam" playsinline crossorigin="anonymous" autoplay></video>
      </a-assets>

      <a-entity id="browser-window" position="0 1.6 -3" class="interactive">
        <a-plane width="3.2" height="2.2" color="#000" opacity="0.9"></a-plane>
        <a-plane id="click-surface" width="3" height="2" color="#222" class="interactive" material="shader: flat">
          <a-text value="STATIONARY WINDOW\nCamera is background\nTap screen to 'click'" align="center" width="2.5"></a-text>
        </a-plane>
      </a-entity>

      <a-entity id="rig">
        <a-camera look-controls wasd-controls-enabled="false">
          
          <a-video src="#webcam" 
                   position="0 0 -10" 
                   width="30" 
                   height="22.5" 
                   material="shader: flat; depthTest: false; depthWrite: false"
                   class="not-interactive">
          </a-video>

          <a-entity cursor="fuse: false"
                    position="0 0 -0.9"
                    geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.012"
                    material="color: #00ff00; shader: flat; depthTest: false"
                    raycaster="objects: .interactive">
          </a-entity>
          
        </a-camera>
      </a-entity>
    </a-scene>

    <script>
      const video = document.getElementById('webcam');
      let backDevices = [];
      let currentIdx = 0;

      async function findBackCameras() {
        // Stop any current stream first
        if (window.stream) {
          window.stream.getTracks().forEach(track => track.stop());
        }

        const allDevices = await navigator.mediaDevices.enumerateDevices();
        
        // STRICT FILTER: Must be videoinput AND must not be the front camera
        // We use a try/catch on facingMode because some browsers hide it until permission is granted
        backDevices = allDevices.filter(d => d.kind === 'videoinput');
        
        // Remove known selfie cameras based on labels if possible
        backDevices = backDevices.filter(d => {
            const label = d.label.toLowerCase();
            return !label.includes('front') && !label.includes('selfie') && !label.includes('user');
        });

        startLens();
      }

      async function startLens() {
        if (backDevices.length === 0) {
            alert("No back cameras detected.");
            return;
        }

        const constraints = {
          video: {
            deviceId: { exact: backDevices[currentIdx].deviceId },
            width: { ideal: 3840 },
            height: { ideal: 2160 },
            frameRate: { ideal: 60 }
          }
        };

        try {
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          window.stream = stream;
          video.srcObject = stream;
        } catch (err) {
          console.error("Lens switch failed, trying generic environment", err);
          const fallback = await navigator.mediaDevices.getUserMedia({ 
              video: { facingMode: { exact: "environment" } } 
          });
          video.srcObject = fallback;
        }
      }

      function toggleLens() {
        if (backDevices.length > 1) {
          currentIdx = (currentIdx + 1) % backDevices.length;
          startLens();
        } else {
          // If the list is short, just try the facingMode toggle
          alert("Only one back camera detected by browser.");
        }
      }

      // Initialize on first click
      window.addEventListener('click', () => {
          if (!window.stream) findBackCameras();
      }, { once: true });

      // Click Feedback
      document.querySelector('#click-surface').addEventListener('click', function() {
        this.setAttribute('color', '#00ff00');
        setTimeout(() => this.setAttribute('color', '#222'), 100);
      });
    </script>
  </body>
</html>
