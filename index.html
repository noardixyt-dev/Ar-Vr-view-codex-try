<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Fixed VR Passthrough</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
      .overlay {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 9999;
      }
      button {
        padding: 15px;
        background: #222;
        color: #0f0;
        border: 1px solid #0f0;
        font-weight: bold;
      }
    </style>
  </head>
  <body>

    <div class="overlay">
      <button onclick="initCamera()">START CAMERA / SWITCH LENS</button>
    </div>

    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .interactive" vr-mode-ui="enabled: true">
      <a-assets>
        <video id="webcam" playsinline crossorigin="anonymous" autoplay></video>
      </a-assets>

      <a-videosphere src="#webcam" rotation="0 -90 0" radius="50"></a-videosphere>

      <a-entity id="browser-window" position="0 1.6 -3" class="interactive">
        <a-plane width="3.2" height="2.2" color="#111" opacity="0.8" position="0 0 -0.01"></a-plane>
        <a-plane id="click-surface" width="3" height="2" color="#333" class="interactive">
          <a-text value="STATIONARY BROWSER\nIf cursor is split, adjust phone in headset." 
                  align="center" width="2.5"></a-text>
        </a-plane>
      </a-entity>

      <a-entity id="rig">
        <a-camera look-controls="pointerLockEnabled: true">
          <a-entity cursor="fuse: false"
                    position="0 0 -1.01"
                    geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015"
                    material="color: #00ff00; shader: flat; transparent: true; opacity: 0.5"
                    raycaster="objects: .interactive">
          </a-entity>
        </a-camera>
      </a-entity>
    </a-scene>

    <script>
      const video = document.getElementById('webcam');
      let currentStream = null;
      let devices = [];
      let deviceIdx = 0;

      async function initCamera() {
        // Stop current stream if switching
        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
        }

        // Fetch devices if we haven't yet
        if (devices.length === 0) {
          const allDevices = await navigator.mediaDevices.enumerateDevices();
          devices = allDevices.filter(d => d.kind === 'videoinput');
        }

        // Set high-quality constraints
        const constraints = {
          video: {
            deviceId: devices[deviceIdx] ? { exact: devices[deviceIdx].deviceId } : undefined,
            width: { ideal: 3840 },
            height: { ideal: 2160 },
            frameRate: { ideal: 60 }
          }
        };

        try {
          currentStream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = currentStream;
          
          // Cycle to next camera for next click (to find ultra-wide)
          deviceIdx = (deviceIdx + 1) % devices.length;
        } catch (err) {
          alert("Camera Error: " + err.message);
        }
      }

      // Handle the tap-to-click logic
      document.querySelector('#click-surface').addEventListener('click', function() {
        this.setAttribute('color', '#00ff00');
        setTimeout(() => this.setAttribute('color', '#333'), 100);
        console.log("VR Click Registered!");
      });
    </script>
  </body>
</html>
