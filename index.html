<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>High-Sync VR Passthrough</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
      #gui {
        position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
        z-index: 1000; display: flex; gap: 10px;
      }
      button {
        padding: 12px 24px; background: #000; color: #0f0; border: 2px solid #0f0;
        border-radius: 30px; font-weight: bold; cursor: pointer;
      }
    </style>
  </head>
  <body style="background: #000;">

    <div id="gui">
      <button onclick="enterVR()">1. ACTIVATE VR</button>
      <button onclick="switchLens()">2. TOGGLE REAR LENS</button>
    </div>

    <a-scene loading-screen="enabled: false" cursor="rayOrigin: mouse" raycaster="objects: .interactive">
      <a-assets>
        <video id="webcam" playsinline crossorigin="anonymous" autoplay></video>
      </a-assets>

      <a-entity id="browser-window" position="0 1.6 -3" class="interactive">
        <a-plane width="3.2" height="2.2" color="#000" opacity="0.9" material="shader: flat; depthTest: false"></a-plane>
        <a-plane id="click-surface" width="3" height="2" color="#222" class="interactive" material="shader: flat; depthTest: false">
          <a-text value="STATIONARY WINDOW\nStereo Sync Active\nTap to Click" align="center" width="2.5" color="#0f0"></a-text>
        </a-plane>
      </a-entity>

      <a-entity id="rig">
        <a-camera look-controls="pointerLockEnabled: true">
          
          <a-video src="#webcam" 
                   id="stereo-bg"
                   position="0 0 -15" 
                   width="40" height="30" 
                   material="shader: flat; depthTest: false; depthWrite: false"
                   class="not-interactive">
          </a-video>

          <a-entity cursor="fuse: false"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015"
                    material="color: #0f0; shader: flat; depthTest: false; transparent: true; opacity: 0.8">
          </a-entity>
          
        </a-camera>
      </a-entity>
    </a-scene>

    <script>
      const video = document.getElementById('webcam');
      let backCameras = [];
      let activeIdx = 0;

      async function enterVR() {
        const scene = document.querySelector('a-scene');
        scene.enterVR();

        // Detect all back-facing cameras
        const devices = await navigator.mediaDevices.enumerateDevices();
        backCameras = devices.filter(d => 
          d.kind === 'videoinput' && 
          !/(front|selfie|user)/i.test(d.label)
        );

        setupCamera();
      }

      async function setupCamera() {
        if (window.stream) window.stream.getTracks().forEach(t => t.stop());

        const constraints = {
          video: {
            deviceId: backCameras[activeIdx] ? { exact: backCameras[activeIdx].deviceId } : undefined,
            width: { ideal: 3840 },
            height: { ideal: 2160 },
            frameRate: { ideal: 60 }
          }
        };

        try {
          window.stream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = window.stream;
        } catch (e) {
          // Fallback to default environment camera
          video.srcObject = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
        }
      }

      function switchLens() {
        if (backCameras.length > 1) {
          activeIdx = (activeIdx + 1) % backCameras.length;
          setupCamera();
        }
      }

      // Tap-to-Click functionality
      document.querySelector('#click-surface').addEventListener('click', function() {
        this.setAttribute('color', '#00ff00');
        setTimeout(() => this.setAttribute('color', '#222'), 150);
        console.log("Click triggered at reticle position.");
      });
    </script>
  </body>
</html>
