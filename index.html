<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR-Tracked VR Window</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  </head>
  <body style="background-color: transparent;">

    <a-scene 
      webxr="optionalFeatures: hit-test, dom-overlay; overlayElement: #ui;"
      cursor="rayOrigin: mouse" 
      raycaster="objects: .interactive"
      transparent="true">
      
      <a-entity id="browser-window" position="0 1.5 -2" class="interactive">
        <a-plane width="2.2" height="1.4" color="#111" opacity="0.9"></a-plane>
        <a-plane id="click-surface" width="2" height="1.2" color="#222" class="interactive" material="shader: flat">
          <a-text value="AR TRACKED WINDOW\nLocked to the world\nLook around me." align="center" width="2"></a-text>
        </a-plane>
      </a-entity>

      <a-entity id="rig">
        <a-camera look-controls>
          <a-entity cursor="fuse: false"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.007; radiusOuter: 0.01"
                    material="color: #00ff00; shader: flat"
                    raycaster="objects: .interactive">
          </a-entity>
        </a-camera>
      </a-entity>

    </a-scene>

    <div id="ui" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);">
        <button onclick="requestAR()" style="padding: 20px; background: #0f0; font-weight: bold;">ENTER AR MODE</button>
    </div>

    <script>
      // This function triggers the high-quality system passthrough
      function requestAR() {
        const sceneEl = document.querySelector('a-scene');
        // This tells the headset/phone to use its official AR passthrough
        sceneEl.enterVR(); 
      }

      // Handle Tap-to-Click
      document.querySelector('#click-surface').addEventListener('click', function() {
        this.setAttribute('color', '#00ff00');
        setTimeout(() => this.setAttribute('color', '#222'), 100);
      });

      // To fix the lens issue, we rely on the device's default AR lens.
      // Most AR engines (ARCore/ARKit) default to the best "Main" or "Wide" 
      // lens automatically to ensure tracking stability.
    </script>
  </body>
</html>
