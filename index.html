<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Stationary Window - Fixed Cursor</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  </head>
  <body>
    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .interactive">
      
      <a-sky color="#050505"></a-sky>
      <a-grid-helper size="10" divisions="10" color="#444"></a-grid-helper>

      <a-entity id="browser-window" position="0 1.6 -3" class="interactive">
        <a-plane width="3.2" height="2.2" color="#333" position="0 0 -0.01"></a-plane>
        
        <a-plane id="click-surface" 
                 width="3" height="2" 
                 color="#222" 
                 class="interactive"
                 material="shader: flat"
                 onclick="handleVRClick()">
          <a-text value="STATIONARY WINDOW\nLook away and I stay here.\nTap screen to 'click' me." 
                  align="center" width="2.8" color="#FFF"></a-text>
        </a-plane>
      </a-entity>

      <a-entity id="rig" position="0 0 0">
        <a-camera look-controls>
          
          <a-entity cursor="fuse: false;"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.012"
                    material="color: #00FF00; shader: flat; opacity: 0.8"
                    raycaster="objects: .interactive">
          </a-entity>
          
        </a-camera>
      </a-entity>

    </a-scene>

    <script>
      function handleVRClick() {
        const surface = document.querySelector('#click-surface');
        surface.setAttribute('color', '#00AAFF'); // Highlight on click
        console.log("Registered click on stationary window!");
        
        setTimeout(() => {
          surface.setAttribute('color', '#222');
        }, 150);
      }
    </script>
  </body>
</html>
